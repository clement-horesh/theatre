<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="theatre-architecture-title theatre-architecture-desc" id="theatre-architecture-root">
<title id="theatre-architecture-title">Theatre app architecture</title>
<desc id="theatre-architecture-desc">Theatre's SwiftUI interface uses AppModel, JellyfinKit, PlaybackSession, VLC and AVPlayer, and account-scoped downloads to browse and play media from your Jellyfin server or local files.</desc>
<defs>
      <style>#theatre-architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #theatre-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #theatre-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#theatre-architecture-root .diagram-container { overflow-x: visible; }
}
      #theatre-architecture-root .intro { max-width: 680px; font-size: 14px; line-height: 1.6; color: #4f5d75; }
      #theatre-architecture-root .diagram-container { margin-top: 20px; }
      #theatre-architecture-root .node-name { font-family: 'Geist', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
      #theatre-architecture-root .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #5a6580; }
      #theatre-architecture-root .tag, #theatre-architecture-root .edge-label, #theatre-architecture-root .zone { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: .08em; fill: #5a6580; }
      #theatre-architecture-root .edge-label { fill: #4f5d75; }
      #theatre-architecture-root .edge { fill: none; stroke: #4f5d75; stroke-width: 1.2; marker-end: url(#theatre-architecture-arrow); }
      #theatre-architecture-root .net { stroke: #2e5aa8; marker-end: url(#theatre-architecture-arrow-link); }
      #theatre-architecture-root .notes { display: grid; grid-template-columns: 1.25fr 1fr; gap: 40px; border-top: 1px solid rgba(45,49,66,.12); padding-top: 24px; }
      #theatre-architecture-root .notes h2 { font-size: 12px; margin-bottom: 8px; font-weight: 600; }
      #theatre-architecture-root .notes p, #theatre-architecture-root details { font-size: 12px; line-height: 1.7; color: #4f5d75; }
      #theatre-architecture-root .notes code, #theatre-architecture-root details code { font-family: var(--font-mono); font-size: 11px; }
      #theatre-architecture-root details { margin-top: 28px; }
      #theatre-architecture-root summary { cursor: pointer; width: fit-content; }
      #theatre-architecture-root details ul { padding-left: 20px; margin-top: 12px; }
      @media(max-width: 640px) {
#theatre-architecture-root .notes { grid-template-columns: 1fr; gap: 24px; }
}
      @media print {
#theatre-architecture-root .diagram-container { overflow-x: visible; }
      #theatre-architecture-root details { display: none; }
}</style>
<marker id="theatre-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="theatre-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#f5f5f5"/>
<rect x="40" y="64" width="944" height="560" rx="8" fill="#2d3142" stroke="#2d3142" stroke-dasharray="4,4" fill-opacity=".02" stroke-opacity=".18"/>
<rect x="56" y="56" width="312" height="16" fill="#f5f5f5"/>
<text class="zone" x="64" y="68">ON YOUR MAC · THEATRE + LOCAL SERVICES</text>
<text class="zone" x="1040" y="88">YOUR SERVER</text>
<!-- Connectors precede all component boxes. -->
<path class="edge" d="M240 160 H336"/>
<path class="edge" d="M544 144 H712"/>
<path class="edge net" d="M920 160 H1040"/>
<path class="edge" d="M440 208 V304"/>
<path class="edge" d="M544 352 H712"/>
<path class="edge" d="M544 332 H616 Q624 332 624 324 V192 Q624 184 632 184 H712"/>
<path class="edge" d="M336 184 H288 Q280 184 280 192 V432 Q280 440 272 440 H176 Q168 440 168 448 V496"/>
<path class="edge" d="M440 416 V496"/>
<path class="edge" d="M544 544 H712"/>
<!-- Deferred progress sync hops over the direct media path at y=376. -->
<path class="edge net" stroke-dasharray="4,3" d="M544 568 H576 Q584 568 584 576 V600 Q584 608 592 608 H944 Q952 608 952 600 V384 a8 8 0 0 0 0 -16 V200 Q952 192 944 192 H920"/>
<path class="edge net" d="M1128 208 V368 Q1128 376 1120 376 H920"/>
<rect x="592" y="118" width="72" height="16" rx="2" fill="#f5f5f5"/><text class="edge-label" x="628" y="129" text-anchor="middle">LIBRARY API</text><rect x="944" y="134" width="72" height="16" rx="2" fill="#f5f5f5"/><text class="edge-label" x="980" y="145" text-anchor="middle">HTTP(S)</text><rect x="632" y="248" width="72" height="16" rx="2" fill="#f5f5f5"/><text class="edge-label" x="668" y="259" text-anchor="middle">PLAN / REPORT</text><rect x="448" y="448" width="96" height="16" rx="2" fill="#f5f5f5"/><text class="edge-label" x="496" y="459" text-anchor="middle">LOCAL LOOKUP</text><rect x="584" y="518" width="88" height="16" rx="2" fill="#f5f5f5"/><text class="edge-label" x="628" y="529" text-anchor="middle">READ / WRITE</text><rect x="960" y="440" width="88" height="16" rx="2" fill="#f5f5f5"/><text class="edge-label" x="1004" y="451" text-anchor="middle">DEFERRED SYNC</text><rect x="1136" y="280" width="88" height="16" rx="2" fill="#f5f5f5"/><text class="edge-label" x="1180" y="291" text-anchor="middle">MEDIA BYTES</text><rect x="176" y="414" width="88" height="16" rx="2" fill="#f5f5f5"/><text class="edge-label" x="220" y="425" text-anchor="middle">RESTORE / SAVE</text><g data-node-id="ui"><rect x="64" y="112" width="176" height="96" rx="6" fill="#f5f5f5"/><rect data-role="bounds" x="64" y="112" width="176" height="96" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity=".10"/><rect x="80" y="124" width="64" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-opacity=".12"/><text class="tag" x="88" y="135">INTERFACE</text><text class="node-name" x="80" y="160">SwiftUI + AppKit</text><text class="sub" x="80" y="180">Library · details · search</text></g><g data-node-id="app"><rect x="336" y="112" width="208" height="96" rx="6" fill="#f5f5f5"/><rect data-role="bounds" x="336" y="112" width="208" height="96" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity=".08"/><rect x="352" y="124" width="64" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-opacity=".12"/><text class="tag" x="360" y="135">APP STATE</text><text class="node-name" x="352" y="160">AppModel</text><text class="sub" x="352" y="180">Sign-in · library · ownership</text></g><g data-node-id="api"><rect x="712" y="112" width="208" height="96" rx="6" fill="#f5f5f5"/><rect data-role="bounds" x="712" y="112" width="208" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="728" y="124" width="84" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-opacity=".12"/><text class="tag" x="736" y="135">SWIFT LIBRARY</text><text class="node-name" x="728" y="160">JellyfinKit</text><text class="sub" x="728" y="180">JellyfinClient · URLSession</text></g><g data-node-id="server"><rect x="1040" y="112" width="176" height="96" rx="6" fill="#f5f5f5"/><rect data-role="bounds" x="1040" y="112" width="176" height="96" rx="6" fill="#2d3142" stroke="#5a6580" stroke-width="1" fill-opacity=".03"/><rect x="1056" y="124" width="56" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-opacity=".12"/><text class="tag" x="1064" y="135">EXTERNAL</text><text class="node-name" x="1056" y="160">Jellyfin server</text><text class="sub" x="1056" y="180">Catalog · watch history</text></g><g data-node-id="session"><rect x="336" y="304" width="208" height="112" rx="6" fill="#f5f5f5"/><rect data-role="bounds" x="336" y="304" width="208" height="112" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity=".08"/><rect x="352" y="316" width="108" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-opacity=".12"/><text class="tag" x="360" y="327">PLAYBACK LIFECYCLE</text><text class="node-name" x="352" y="352">PlaybackSession</text><text class="sub" x="352" y="372">Window · next episode</text><text class="sub" x="352" y="388">PlaybackReporter · Now Playing</text></g><g data-node-id="engine"><rect x="712" y="304" width="208" height="112" rx="6" fill="#f5f5f5"/><rect data-role="bounds" x="712" y="304" width="208" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="728" y="316" width="112" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-opacity=".12"/><text class="tag" x="736" y="327">PLAYBACK CONTROLLER</text><text class="node-name" x="728" y="352">VLC + AVPlayer</text><text class="sub" x="728" y="372">VLC: broad-format playback</text><text class="sub" x="728" y="388">AVPlayer: PiP / AirPlay</text></g><g data-node-id="credentials"><rect x="64" y="496" width="208" height="96" rx="6" fill="#f5f5f5"/><rect data-role="bounds" x="64" y="496" width="208" height="96" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity=".05"/><rect x="80" y="508" width="72" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-opacity=".12"/><text class="tag" x="88" y="519">LOCAL STATE</text><text class="node-name" x="80" y="544">Keychain + preferences</text><text class="sub" x="80" y="564">Token · UserDefaults settings</text></g><g data-node-id="downloads"><rect x="336" y="496" width="208" height="96" rx="6" fill="#f5f5f5"/><rect data-role="bounds" x="336" y="496" width="208" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="352" y="508" width="52" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-opacity=".12"/><text class="tag" x="360" y="519">OFFLINE</text><text class="node-name" x="352" y="544">DownloadManager</text><text class="sub" x="352" y="564">Queue · transfers · progress</text></g><g data-node-id="files"><rect x="712" y="496" width="208" height="96" rx="6" fill="#f5f5f5"/><rect data-role="bounds" x="712" y="496" width="208" height="96" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity=".05"/><rect x="728" y="508" width="116" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-opacity=".12"/><text class="tag" x="736" y="519">ACCOUNT-SCOPED FILES</text><text class="node-name" x="728" y="544">Downloads + catalog</text><text class="sub" x="728" y="564">Media · subtitles · artwork</text></g><line x1="64" y1="656" x2="1216" y2="656" stroke="#2d3142" stroke-opacity=".12"/>
<line x1="64" y1="684" x2="92" y2="684" stroke="#4f5d75" stroke-width="1.2"/>
<text class="sub" x="104" y="687">Control / local access</text>
<line x1="348" y1="684" x2="376" y2="684" stroke="#2e5aa8" stroke-width="1.2"/>
<text class="sub" x="388" y="687">Server communication</text>
<line x1="648" y1="684" x2="676" y2="684" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3"/>
<text class="sub" x="688" y="687">Download API + deferred sync</text>
<rect x="1000" y="676" width="12" height="12" rx="2" fill="#bf4520" stroke="#bf4520" fill-opacity=".08"/>
<text class="sub" x="1024" y="687">Core coordination</text>
</svg>
